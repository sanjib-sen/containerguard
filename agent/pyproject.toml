[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "containerguard-agent"
version = "1.0.0"
dependencies = [
    "httpx>=0.27",
    "psutil>=6.0",
    "pydantic-settings>=2.0",
    "watchdog>=4.0",
]

[project.scripts]
containerguard-agent = "src.main:entrypoint"

[tool.setuptools.packages.find]
include = ["src*"]
