services:
  db:
    image: postgres:16
    container_name: containerguard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: containerguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d containerguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
    container_name: containerguard-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DSN: postgresql+asyncpg://postgres:postgres@db:5432/containerguard
    command: ["alembic", "upgrade", "head"]

  server:
    build:
      context: ./server
    container_name: containerguard-server
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PG_DSN: postgresql+asyncpg://postgres:postgres@db:5432/containerguard
      PROMETHEUS_MULTIPROC_DIR: /tmp/containerguard-prometheus
    ports:
      - "8001:8000"
    volumes:
      - prometheus_multiproc:/tmp/containerguard-prometheus

  heartbeat-monitor:
    build:
      context: ./server
    container_name: containerguard-heartbeat-monitor
    depends_on:
      server:
        condition: service_started
    environment:
      PG_DSN: postgresql+asyncpg://postgres:postgres@db:5432/containerguard
      PROMETHEUS_MULTIPROC_DIR: /tmp/containerguard-prometheus
    command: ["python", "-m", "src.workers.heartbeat_monitor"]
    volumes:
      - prometheus_multiproc:/tmp/containerguard-prometheus

volumes:
  postgres_data:
  prometheus_multiproc:
