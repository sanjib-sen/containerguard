services:
  basic-app:
    build:
      context: .
      dockerfile: ./demos/basic-app/Dockerfile
    container_name: containerguard-basic-app
    environment:
      SERVER_URL: http://containerguard-server:8000
      CONTAINER_ID: containerguard-basic-app
      IMAGE: containerguard/basic-app:local
      TELEMETRY_INTERVAL_SECONDS: 15
      HEARTBEAT_INTERVAL_SECONDS: 5
      PORT: 8080
    networks:
      - containerguard
    ports:
      - "8088:8080"

networks:
  containerguard:
    external: true
    name: containerguard_default
